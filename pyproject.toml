[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devopstoolbox"
dynamic = ["version"]
description = "A Python-based CLI toolkit for automating daily DevOps operations."
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [
  { name = "George Farias", email = "georgesouzafarias@gmail.com" },
]
keywords = [
    "devops",
    "kubernetes",
    "k8s",
    "aws",
    "cli",
    "automation",
    "sre",
    "infrastructure",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "boto3",
    "kubernetes",
    "pyyaml",
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py39"
line-length = 180

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
]

[project.scripts]
devopstoolbox = "devopstoolbox.main:app"

[project.urls]
Homepage = "https://github.com/georgesouzafarias/DevOpsToolbox"
Repository = "https://github.com/georgesouzafarias/DevOpsToolbox"
Issues = "https://github.com/georgesouzafarias/DevOpsToolbox/issues"

[tool.setuptools_scm]